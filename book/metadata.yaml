# Book settings. Sizes are in mm.
title: 프로덕트를 처음부터 디자인하는 방법
author: 박근우

# Trim (cut) size and bleed. The PDF page = trim + 2 × bleed.
trim-width: 128
trim-height: 188
bleed: 5

# Margins measured from the trim (cut) line, not from the file edge.
margin-top: 22
margin-bottom: 20
margin-inner: 18
margin-outer: 15

# Body font size / line spacing in pt.
font-size: 9.5
line-height: 16.5

main-font: Noto Serif CJK KR
sans-font: Noto Sans CJK KR
mono-font: Noto Sans Mono CJK KR
