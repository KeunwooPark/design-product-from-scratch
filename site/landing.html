<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="style.css">
</head>
<body class="landing">
<main>
$for(languages)$
  <section class="edition" lang="$languages.lang$">
$if(multilingual)$
    <p class="language">$languages.language-name$</p>
$endif$
    <h1>$languages.title$</h1>
    <p class="author">$languages.author$</p>
$if(languages.description)$
    <p class="description">$languages.description$</p>
$endif$
    <p class="actions">
      <a class="button primary" href="$languages.href$">$languages.read$</a>
$if(languages.pdf)$
      <a class="button" href="$languages.pdf$" download>$languages.pdf-label$</a>
$endif$
    </p>
  </section>
$endfor$
</main>
</body>
</html>
